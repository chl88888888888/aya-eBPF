[workspace]
resolver = "2"
members = [
    "aya-test",
    "aya-test-common",
    "aya-test-ebpf",
]
default-members = ["aya-test", "aya-test-common"]

[workspace.package]
license = "MIT OR Apache-2.0"
edition = "2024"

[workspace.dependencies]
aya = { version = "0.14.0", default-features = false }
aya-build = { version = "0.2.0", default-features = false }
aya-ebpf = { version = "0.2.1", default-features = false }
aya-log = { version = "0.3.0", default-features = false }
aya-log-ebpf = { version = "0.2.0", default-features = false }

anyhow = { version = "1", default-features = false }
cargo_metadata = { version = "0.23.0", default-features = false }
# `std` feature is currently required to build `clap`.
#
# See https://github.com/clap-rs/clap/blob/61f5ee5/clap_builder/src/lib.rs#L15.
clap = { version = "4.5.20", default-features = false, features = ["std", "derive"] }
env_logger = { version = "0.11.5", default-features = false }
libc = { version = "0.2.159", default-features = false }
log = { version = "0.4.22", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "1"
tokio = { version = "1.40.0", default-features = false }
which = { version = "6.0.0", default-features = false }
hdrhistogram = { version = "7", default-features = false }

[profile.release.package.aya-test-ebpf]
debug = 2
codegen-units = 1
strip = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
